# nmem-studio single-agent appliance.
#
#   docker compose up          # first boot: open http://localhost:8080 → the setup wizard
#                              # after you Create an agent, the container restarts into it
#
# The LLM is EXTERNAL (you point the wizard at your own endpoint / key — local vLLM/Ollama,
# or a hosted API). Everything else — the studio, Postgres+pgvector, and the bundled
# all-MiniLM embedder — runs in here. State lives in named volumes, so the agent survives
# `compose down` and comes back up in agent mode.
services:
  studio:
    build:
      context: ../../..            # the apps/ monorepo root (reaches the sibling nmem-* libs)
      dockerfile: nmem/docker/studio/Dockerfile
    image: nmem-studio:latest
    restart: unless-stopped        # the create→boot seam restarts the container into agent mode
    ports:
      # Bound to LOOPBACK by default — the wizard + /studio/create + /act are an UNAUTHENTICATED
      # admin surface (Create can register an MCP stdio command that runs on restart). Only expose
      # it beyond localhost behind your own auth/proxy: STUDIO_BIND=0.0.0.0 docker compose up.
      # Override the host port if 8080 is taken: STUDIO_HOST_PORT=18080 docker compose up.
      - "${STUDIO_BIND:-127.0.0.1}:${STUDIO_HOST_PORT:-8080}:8080"
    environment:
      STUDIO_DATA_DIR: /data
      STUDIO_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nmem
      POSTGRES_PASSWORD: nmem
      NMEM_AGENT_DB: agent_nmem            # fixed single-agent DB (so viz knows the URL up-front)
      # AUTH: set STUDIO_AUTH_PASSWORD (your shell or a .env) to REQUIRE login on the whole admin
      # surface — do this before exposing the studio beyond loopback (then STUDIO_BIND=0.0.0.0 is safe).
      # Unset = unauthenticated (loopback only). STUDIO_COOKIE_SECURE=1 when serving over HTTPS.
      STUDIO_AUTH_PASSWORD: ${STUDIO_AUTH_PASSWORD:-}
      STUDIO_AUTH_USER: ${STUDIO_AUTH_USER:-admin}
      STUDIO_COOKIE_SECURE: ${STUDIO_COOKIE_SECURE:-}
      # live cognition → the bundled nmem-viz hub (agent mode streams deltas to its /ingest)
      NMEM_SYM_VIZ_ENABLED: "1"
      NMEM_VIZ_INGEST_URL: http://viz:5174/ingest
      NMEM_VIZ_PUBLIC_URL: "http://localhost:${VIZ_HOST_PORT:-5174}/"
      # network access to a HOST-run LLM (e.g. local vLLM/Ollama) from inside the container:
      # point the wizard at http://host.docker.internal:PORT/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nmem
      POSTGRES_PASSWORD: nmem
      POSTGRES_DB: postgres         # the appliance CREATEs the per-agent DB itself
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmem"]
      interval: 5s
      timeout: 3s
      retries: 20

  # nmem-viz — the live 3D "brain": full graph snapshot from the agent DB + live deltas the
  # agent streams to /ingest. Restart-loops until the agent DB exists (created on first Create),
  # which is fine — viz only matters once there's an agent.
  viz:
    build:
      context: ../../../nmem-viz
      dockerfile: Dockerfile
    image: nmem-viz:latest
    restart: unless-stopped
    ports:
      - "${STUDIO_BIND:-127.0.0.1}:${VIZ_HOST_PORT:-5174}:5174"   # loopback by default (see studio)
    environment:
      NMEM_VIZ_DATABASE_URL: postgresql://nmem:nmem@postgres:5432/agent_nmem
      NMEM_VIZ_AGENT_ID: appliance
      NMEM_VIZ_TITLE: "nmem agent · brain"
      NMEM_VIZ_HTTP_PORT: "5174"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  agent_data:
  pg_data:
  redis_data:
