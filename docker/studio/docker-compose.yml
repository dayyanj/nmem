# nmem-studio single-agent appliance.
#
#   docker compose up          # first boot: open http://localhost:8080 → the setup wizard
#                              # after you Create an agent, the container restarts into it
#
# The LLM is EXTERNAL (you point the wizard at your own endpoint / key — local vLLM/Ollama,
# or a hosted API). Everything else — the studio, Postgres+pgvector, and the bundled
# all-MiniLM embedder — runs in here. State lives in named volumes, so the agent survives
# `compose down` and comes back up in agent mode.
services:
  studio:
    build:
      context: ../../..            # the apps/ monorepo root (reaches the sibling nmem-* libs)
      dockerfile: nmem/docker/studio/Dockerfile
    image: ${NMEM_REGISTRY:-docker.io/dayyanj}/nmem-studio:${NMEM_VERSION:-latest}
    restart: unless-stopped        # the create→boot seam restarts the container into agent mode
    ports:
      # Bound to LOOPBACK by default — the wizard + /studio/create + /act are an admin surface (Create
      # can register an MCP stdio command that runs on restart). To expose beyond localhost, set
      # STUDIO_AUTH_PASSWORD (below) to require login first, then STUDIO_BIND=0.0.0.0 docker compose up.
      # Override the host port if 8080 is taken: STUDIO_HOST_PORT=18080 docker compose up.
      - "${STUDIO_BIND:-127.0.0.1}:${STUDIO_HOST_PORT:-8080}:8080"
    environment:
      # The nmem-studio image runs its embedded Postgres+viz by default (the one-line `docker run`);
      # here we turn those OFF and use the separate `postgres` + `viz` services below (needed for the
      # identity/perception profiles + hives). Same image, multi-service shape.
      NMEM_EMBEDDED_PG: "0"
      NMEM_EMBEDDED_VIZ: "0"
      STUDIO_DATA_DIR: /data
      STUDIO_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: nmem
      POSTGRES_PASSWORD: nmem
      NMEM_AGENT_DB: agent_nmem            # fixed single-agent DB (so viz knows the URL up-front)
      # The appliance's external standing goals come ONLY from the persona, so treat objectives as
      # declarative: editing/removing one in the wizard retires its goal (seed_persona reconciles).
      NMEM_PERSONA_RECONCILE_OBJECTIVES: "1"
      # AUTH: set STUDIO_AUTH_PASSWORD (your shell or a .env) to REQUIRE login on the whole admin
      # surface — do this before exposing the studio beyond loopback (then STUDIO_BIND=0.0.0.0 is safe).
      # Unset = unauthenticated (loopback only). STUDIO_COOKIE_SECURE=1 when serving over HTTPS.
      STUDIO_AUTH_PASSWORD: ${STUDIO_AUTH_PASSWORD:-}
      STUDIO_AUTH_USER: ${STUDIO_AUTH_USER:-admin}
      STUDIO_COOKIE_SECURE: ${STUDIO_COOKIE_SECURE:-}
      # live cognition → the bundled nmem-viz hub (agent mode streams deltas to its /ingest)
      NMEM_SYM_VIZ_ENABLED: "1"
      NMEM_VIZ_INGEST_URL: http://viz:5174/ingest
      NMEM_VIZ_PUBLIC_URL: "http://localhost:${VIZ_HOST_PORT:-5174}/"
      # Chat-style (writing-style) identity — the LUAR sidecars (compose `identity` profile). The
      # agent only calls these when NMEM_CHAT_TEXT_IDENTITY_ENABLED is on (wizard pill); the client
      # fails OPEN (identity off) if the sidecars aren't running, so setting the URLs is harmless when
      # the profile is down. Bring identity up: `docker compose --profile identity up`.
      NMEM_IDENTITY_MATCHER_URL: http://identity-matcher:9404
      NMEM_IDENTITY_TEXT_EMBED_URL: http://identity-text-embed:9406
      # Embodied visual memory (perception profile + a computer_use agent): the sensory store. Reuses
      # the agent DB; SensorGraph.connect() self-applies its migrations. Only touched when
      # NMEM_VISUAL_MEMORY_ENABLED is on AND a sandbox is attached.
      NMEM_SENSOR_DB_DSN: postgresql://nmem:nmem@postgres:5432/agent_nmem
      # network access to a HOST-run LLM (e.g. local vLLM/Ollama) from inside the container:
      # point the wizard at http://host.docker.internal:PORT/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nmem
      POSTGRES_PASSWORD: nmem
      POSTGRES_DB: postgres         # the appliance CREATEs the per-agent DB itself
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmem"]
      interval: 5s
      timeout: 3s
      retries: 20

  # nmem-viz — the live 3D "brain": full graph snapshot from the agent DB + live deltas the
  # agent streams to /ingest. Restart-loops until the agent DB exists (created on first Create),
  # which is fine — viz only matters once there's an agent.
  viz:
    build:
      context: ../../../nmem-viz
      dockerfile: Dockerfile
    image: ${NMEM_REGISTRY:-docker.io/dayyanj}/nmem-viz:${NMEM_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${STUDIO_BIND:-127.0.0.1}:${VIZ_HOST_PORT:-5174}:5174"   # loopback by default (see studio)
    environment:
      NMEM_VIZ_DATABASE_URL: postgresql://nmem:nmem@postgres:5432/agent_nmem
      NMEM_VIZ_AGENT_ID: appliance
      NMEM_VIZ_TITLE: "nmem agent · brain"
      NMEM_VIZ_HTTP_PORT: "5174"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  # ── identity sidecars (profile: identity) ──────────────────────────────────────────
  # Writing-style (LUAR) identity for the chat path. Opt-in — they run only under the
  # `identity` profile — but the LUAR checkpoint is baked into the image (offline first boot).
  # One image, two roles (IDENTITY_ROLE). Enable in the wizard with the CHAT · TEXT_IDENTITY pill.
  #   docker compose --profile identity up
  identity-matcher:
    profiles: ["identity"]
    build:
      context: ../../..
      dockerfile: nmem/docker/studio/Dockerfile.identity
    image: ${NMEM_REGISTRY:-docker.io/dayyanj}/nmem-identity:${NMEM_VERSION:-latest}
    restart: unless-stopped
    environment:
      IDENTITY_ROLE: matcher
      # Its own DB in the shared Postgres; the entrypoint creates it + applies the schema (idempotent).
      NMEM_IDENTITY_DSN: postgresql://nmem:nmem@postgres:5432/nmem_identity
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9404/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy

  identity-text-embed:
    profiles: ["identity"]
    build:
      context: ../../..
      dockerfile: nmem/docker/studio/Dockerfile.identity
    image: ${NMEM_REGISTRY:-docker.io/dayyanj}/nmem-identity:${NMEM_VERSION:-latest}
    restart: unless-stopped
    environment:
      IDENTITY_ROLE: text-embed          # loads rrivera1849/LUAR-MUD (baked in), serves /embed on 9406
    healthcheck:
      # /health.ok flips true only once the LUAR model has finished loading → doubles as readiness.
      test: ["CMD-SHELL", "curl -fsS http://localhost:9406/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40

  # ── computer-use sandbox (profile: perception) ─────────────────────────────────────
  # The bundled nmem-sandbox — a browser/desktop the agent drives over an HTTP action API. Opt-in
  # (perception profile). A perception/research agent's wizard `computer_use.url` points at it
  # (http://sandbox:8080). The sandbox has its OWN vision model — set SANDBOX_VLM_URL / _MODEL (its
  # brain, separate from the agent's). The agent reaches the harness API over the compose network
  # (http://sandbox:8080) — that port is NOT published to the host.
  #   SANDBOX_VLM_URL=http://host.docker.internal:8003/v1/chat/completions \
  #   SANDBOX_VLM_MODEL=your-vlm docker compose --profile perception up
  sandbox:
    profiles: ["perception"]
    build:
      context: ../../../nmem-sandbox
      dockerfile: Dockerfile
    image: ${NMEM_REGISTRY:-docker.io/dayyanj}/nmem-sandbox:${NMEM_VERSION:-latest}
    restart: unless-stopped
    ports:
      # noVNC (watch it work) is PINNED to loopback — NOT ${STUDIO_BIND} — because x11vnc runs with
      # -nopw and studio's session auth does not cover this port; inheriting 0.0.0.0 would expose an
      # unauthenticated desktop. Reach it locally at http://localhost:6080/vnc.html or via an SSH tunnel.
      - "127.0.0.1:${SANDBOX_NOVNC_PORT:-6080}:6080"
    environment:
      VLM_URL: ${SANDBOX_VLM_URL:-}       # REQUIRED for the sandbox to act (its own vision model)
      VLM_MODEL: ${SANDBOX_VLM_MODEL:-}
      VLM_BACKEND: ${SANDBOX_VLM_BACKEND:-openai}
      VLM_API_KEY: ${SANDBOX_VLM_API_KEY:-}
      SANDBOX_CAPTURE_FRAMES: "1"         # capture keyframes so visual memory has frames to ingest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sandbox_artifacts:/home/sandbox/artifacts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  agent_data:
  pg_data:
  redis_data:
  sandbox_artifacts:
