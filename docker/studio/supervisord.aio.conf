; nmem-studio all-in-one: run Postgres + nmem-viz + the studio in one container. supervisord is PID 1
; (reaps zombies, restarts the studio on its create→boot self-SIGTERM). All logs go to the container
; stdout/stderr so `docker logs` shows everything.
[supervisord]
nodaemon=true
user=root
pidfile=/tmp/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:postgres]
command=gosu postgres /usr/lib/postgresql/16/bin/postgres -D /data/pgdata
priority=10
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:viz]
command=/opt/venv/bin/python server/viz_server.py
directory=/opt/viz
; viz restart-loops until the agent DB exists (created on first Create) — harmless; it only matters
; once there's an agent. Uses loopback trust auth (password ignored).
environment=NMEM_VIZ_DATABASE_URL="postgresql://nmem:nmem@127.0.0.1:5432/agent_nmem",NMEM_VIZ_AGENT_ID="appliance",NMEM_VIZ_TITLE="nmem agent · brain",NMEM_VIZ_HTTP_PORT="5174"
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:studio]
command=/aio-studio.sh
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
