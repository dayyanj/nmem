# Build + push the nmem appliance images on a version tag (open, free pull-and-run distribution).
#
#   git tag v1.0.0 && git push origin v1.0.0   → builds nmem-studio + nmem-viz + nmem-identity +
#                                                 nmem-sandbox :1.0.0 (+ :latest)
#
# REQUIRES three repo/org secrets to be wired (Settings → Secrets):
#   REGISTRY_USERNAME / REGISTRY_PASSWORD  — a push credential for registry.spwig.com
#   REPO_TOKEN                             — read access to the sibling repos (cross-repo checkout)
# and confirmation that the sibling repos (nmem-sym / nmem-act / nmem-exchange / nmem-viz /
# nmem-sym-sensor / nmem-identity / nmem-sandbox) live under
# the SAME owner as this repo. If instead you publish the libs to a package index, drop the sibling
# checkouts and have the Dockerfile pip-install them — then this only needs the registry secrets.
name: Publish appliance images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build + push (e.g. 1.0.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Reassemble the apps/ monorepo layout the studio Dockerfile expects (siblings side-by-side).
      - uses: actions/checkout@v4
        with:
          path: nmem
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/nmem-sym"
          path: nmem-sym
          token: "${{ secrets.REPO_TOKEN }}"
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/nmem-act"
          path: nmem-act
          token: "${{ secrets.REPO_TOKEN }}"
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/nmem-exchange"
          path: nmem-exchange
          token: "${{ secrets.REPO_TOKEN }}"
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/nmem-viz"
          path: nmem-viz
          token: "${{ secrets.REPO_TOKEN }}"
      # nmem-sym-sensor → visual-memory bits in the studio image; nmem-identity → the LUAR sidecar
      # image; nmem-sandbox → the perception sandbox image (all built by publish.sh).
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/nmem-sym-sensor"
          path: nmem-sym-sensor
          token: "${{ secrets.REPO_TOKEN }}"
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/nmem-identity"
          path: nmem-identity
          token: "${{ secrets.REPO_TOKEN }}"
      - uses: actions/checkout@v4
        with:
          repository: "${{ github.repository_owner }}/nmem-sandbox"
          path: nmem-sandbox
          token: "${{ secrets.REPO_TOKEN }}"

      - name: Log in to registry.spwig.com
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: printf '%s' "$REGISTRY_PASSWORD" | docker login registry.spwig.com -u "$REGISTRY_USERNAME" --password-stdin

      - name: Build + push images
        env:
          REGISTRY: registry.spwig.com
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="${REF_NAME#v}"; fi
          case "$V" in ""|*/*|*" "*) echo "invalid version '$V' — expected e.g. 1.0.0 (tag it vX.Y.Z)"; exit 1;; esac
          VERSION="$V" REGISTRY="$REGISTRY" ./nmem/docker/publish.sh --push
